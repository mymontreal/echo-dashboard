<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Echo Show 10 Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1421;color:#f3f7fc;font-family:Arial,Helvetica,sans-serif}main{height:100vh;min-height:520px;padding:16px;display:grid;grid-template-columns:1.3fr 1fr;grid-template-rows:94px 1fr 116px;gap:12px}.panel{background:#172538;border:1px solid #293c51;border-radius:14px;padding:14px;overflow:hidden}.top{grid-column:1/3;display:flex;justify-content:space-between;align-items:center}.clock{font-size:58px;font-weight:700;letter-spacing:-2px}.date{font-size:19px;color:#aabed0}.weather{font-size:24px;text-align:right}.weather small{display:block;font-size:14px;color:#aabed0;margin-top:7px}.heading{font-size:16px;color:#aabed0;letter-spacing:1.3px;text-transform:uppercase;margin-bottom:12px}.markets{display:flex;flex-direction:column;gap:10px}.market{background:#203249;border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.symbol{font-size:17px;font-weight:700}.price{font-size:22px;font-weight:bold;text-align:right}.change{font-size:14px;color:#9bb0c4;text-align:right}.positive{color:#5fe1a3}.negative{color:#ff8f9b}.rightcol{display:grid;grid-template-rows:1fr 1fr;gap:12px;min-height:0}.item{font-size:16px;line-height:1.4;border-bottom:1px solid #304359;padding:7px 0}.bottom{grid-column:1/3;display:flex;justify-content:space-between;align-items:center}.status{color:#aabed0;font-size:14px}.button{background:#304762;border:0;border-radius:9px;color:white;padding:11px 14px;font-size:15px;cursor:pointer}.small{font-size:13px;color:#aabed0}.audio{position:absolute;width:1px;height:1px;opacity:.01;pointer-events:none}@media(max-width:700px){main{padding:8px;gap:7px;grid-template-rows:80px 1fr 85px;min-height:420px}.panel{padding:9px}.clock{font-size:40px}.date{font-size:13px}.weather{font-size:18px}.heading{font-size:12px;margin-bottom:7px}.market{padding:7px}.symbol{font-size:13px}.price{font-size:15px}.change{font-size:11px}.item{font-size:12px;padding:5px 0}.status{font-size:11px}.button{padding:8px;font-size:12px}}
</style></head><body><main><header class="panel top"><div><div id="clock" class="clock">--:--</div><div id="date" class="date">Loading date...</div></div><div class="weather"><div id="weather">San Jose · --°F</div><small id="weather-detail">Checking conditions...</small></div></header><section class="panel"><div class="heading">Markets & watchlist</div><div class="markets" id="markets"><div class="market"><span class="symbol">S&amp;P 500</span><span class="price">Loading...</span></div></div><p class="small" id="market-note">Market data may be delayed.</p></section><div class="rightcol"><section class="panel"><div class="heading">Headlines</div><div id="news"><div class="item">Loading news...</div></div></section><section class="panel"><div class="heading">Today</div><div class="item" id="daynote">Your at-a-glance information center</div><div class="item" id="connection">Checking data connections...</div></section></div><footer class="panel bottom"><div><div class="status" id="status">Starting dashboard...</div><div class="small">Tap “Keep awake” once after opening in Silk</div></div><button class="button" id="start">▶ Keep awake</button></footer></main><audio class="audio" id="keepalive" loop playsinline preload="auto"></audio><script>
// Clock in San Jose time, regardless of browser timezone.
function clock(){const now=new Date();document.getElementById('clock').textContent=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',minute:'2-digit'}).format(now);document.getElementById('date').textContent=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',weekday:'long',month:'long',day:'numeric'}).format(now)}clock();setInterval(clock,10000);
const fmt=(v,d=2)=>Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
async function weather(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.3382&longitude=-121.8863&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FLos_Angeles',{cache:'no-store'});if(!r.ok)throw Error('weather');const c=(await r.json()).current;document.getElementById('weather').textContent='San Jose · '+Math.round(c.temperature_2m)+'°F';document.getElementById('weather-detail').textContent='Humidity '+c.relative_humidity_2m+'% · Wind '+Math.round(c.wind_speed_10m)+' mph'}catch(e){document.getElementById('weather-detail').textContent='Weather temporarily unavailable'}}
// Yahoo public quote endpoint is not reliably CORS-enabled on Silk; use a free CORS-compatible Stooq daily feed via a public proxy only if reachable.
// No fabricated prices: failed requests display unavailable.
const symbols=[['S&P 500','^spx'],['NASDAQ','^ndq'],['Apple','aapl.us'],['NVIDIA','nvda.us'],['AMD','amd.us']];
async function markets(){const box=document.getElementById('markets');box.innerHTML=symbols.map(([name])=>'<div class="market"><span class="symbol">'+name+'</span><span><div class="price">—</div><div class="change">Awaiting data</div></span></div>').join('');try{const url='https://stooq.com/q/l/?s='+symbols.map(s=>encodeURIComponent(s[1])).join(',')+'&f=sd2t2ohlcv&h&e=csv';const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('quotes');const csv=await r.text();const lines=csv.trim().split(/\r?\n/).slice(1);let ok=0;lines.forEach((line,i)=>{const cells=line.split(',');const v=Number(cells[6]);if(Number.isFinite(v)&&v>0&&box.children[i]){box.children[i].querySelector('.price').textContent=fmt(v);box.children[i].querySelector('.change').textContent='Latest available close';ok++}});if(!ok)throw Error('no quotes');document.getElementById('market-note').textContent='Latest available prices, not real-time.'}catch(e){document.getElementById('market-note').textContent='Quotes unavailable in this browser. A hosted data proxy may be needed.';box.querySelectorAll('.change').forEach(e=>e.textContent='Data connection needed')}}
async function news(){try{const r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent('https://feeds.bbci.co.uk/news/world/rss.xml'),{cache:'no-store'});if(!r.ok)throw Error('news');const j=await r.json();if(!j.items?.length)throw Error('empty');document.getElementById('news').innerHTML=j.items.slice(0,3).map(i=>'<div class="item">'+i.title.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'</div>').join('')}catch(e){document.getElementById('news').innerHTML='<div class="item">News feed unavailable. Check connection.</div>'}}
weather();markets();news();setInterval(weather,600000);setInterval(markets,900000);setInterval(news,1800000);
// A one-minute silent WAV generated in-browser and played on loop after user gesture.
function silentWav(){const sampleRate=8000,secs=60,count=sampleRate*secs,bytes=44+count*2,b=new ArrayBuffer(bytes),v=new DataView(b);function str(o,s){for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))}str(0,'RIFF');v.setUint32(4,bytes-8,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sampleRate,true);v.setUint32(28,sampleRate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,count*2,true);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
const audio=document.getElementById('keepalive');audio.src=silentWav();document.getElementById('start').onclick=async()=>{try{await audio.play();document.getElementById('status').textContent='Keep-awake audio playing · screen test active';document.getElementById('start').textContent='✓ Playing'}catch(e){document.getElementById('status').textContent='Audio blocked — tap Keep awake again'}};
</script></body></html>
